services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - deadlock_timeout=500ms
      - -c
      - log_lock_waits=on

  keycloak:
    environment:
      KC_LOG_LEVEL: error

  app:
    ports: !override
      - "8081-8083:8080"
    environment:
      APP_ROLES: ${APP_ROLES:-api,consumer,outbox,pending}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    deploy:
      replicas: 3

  app-fault:
    extends:
      file: docker-compose.yml
      service: app
    profiles: [fault]
    restart: "no"
    ports: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ROLES: ${FAULT_ROLES:-consumer,outbox}
      FAULT_INJECT: ${FAULT_INJECT:-}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
