name: backend-challenge

x-app-env: &app-env
  HTTP_ADDR: ":8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_START_TIMEOUT: 30s
  APP_STOP_TIMEOUT: 25s
  DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable&pool_max_conns=${DB_POOL_MAX_CONNS:-20}&pool_min_conns=2
  OIDC_ISSUER: ${KEYCLOAK_HOSTNAME:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-wallet}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wallet-api}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wallet-events.fifo
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "30"
  SQS_MAX_MESSAGES: "10"

x-app: &app
  build:
    context: .
    target: runtime
  image: backend-challenge/app:local
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_INITDB_ARGS: --data-checksums
      WALLET_MIGRATOR_PASSWORD: ${WALLET_MIGRATOR_PASSWORD:-wallet_migrator}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=on
      - -c
      - deadlock_timeout=500ms
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=250
    shm_size: 256mb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://keycloak:8080}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-warn}
      JAVA_OPTS_APPEND: -XX:+UseParallelGC -XX:MaxRAMPercentage=70 -Djava.security.egd=file:/dev/urandom
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      SERVICES: sqs,iam,sts
      EAGER_SERVICE_LOADING: "1"
      SQS_ENDPOINT_STRATEGY: "off"
      SQS_DISABLE_CLOUDWATCH_METRICS: "1"
      SKIP_SSL_CERT_DOWNLOAD: "1"
      DISABLE_EVENTS: "1"
      PERSISTENCE: "0"
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          out=$$(curl -sf http://localhost:4566/_localstack/init/ready) &&
          echo "$$out" | grep -q '"completed": true' &&
          echo "$$out" | grep -q '"state": "SUCCESSFUL"' &&
          ! echo "$$out" | grep -q '"state": "ERROR"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: .
      target: runtime
    image: backend-challenge/app:local
    entrypoint: ["/migrate"]
    command: ["up"]
    restart: "no"
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgres://wallet_migrator:${WALLET_MIGRATOR_PASSWORD:-wallet_migrator}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      APP_ROLES: ${APP_ROLES:-api,consumer,outbox,pending}

volumes:
  pgdata:
